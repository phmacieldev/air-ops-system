# ── Database ──────────────────────────────────────────────────────────────
# Local dev: DATABASE_URL não definida → usa localhost (docker-compose sobe o banco)
# Produção:  DATABASE_URL definida no Render → usa Supabase
spring.datasource.url=jdbc:postgresql://localhost:5432/air_ops
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:1234}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.docker.compose.enabled=true

# ── Connection pool ────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ── Security ──────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:air-ops-system-local-dev-secret-1234567890}

# ── CORS ──────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Discord ───────────────────────────────────────────────────────────────
discord.webhook.reports=${DISCORD_WEBHOOK_REPORTS:}
discord.webhook.flights=${DISCORD_WEBHOOK_FLIGHTS:}

# ── Flyway ────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# ── Server ────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
