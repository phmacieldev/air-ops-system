services:
  postgres:
    image: postgres:18
    container_name: air_ops_postgres
    environment:
      POSTGRES_DB: air_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - air_ops_data:/var/lib/postgresql/data

volumes:
  air_ops_data:
